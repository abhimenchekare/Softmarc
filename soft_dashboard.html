<style>

:root{
  --navy-950:#051B33;
  --navy-900:#06284A;
  --navy-800:#0A3D66;
  --cyan-500:#11C7F4;
  --cyan-600:#0A9FD1;
  --cyan-700:#0A73B8;
  --surface:#FFFFFF;
  --bg:#F1F6FB;
  --text-900:#0E2238;
  --text-600:#55677E;
  --text-400:#90A0B4;
  --border:#E1E9F1;
  --success:#22B37A;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius-lg:18px;
  --radius-md:14px;
  --radius-sm:10px;
  --sidebar-w:252px;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text-900);
  display:flex;
  min-height:100vh;
}

a{ color:inherit; }

/* ---------- Sidebar ---------- */

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg,var(--navy-950),var(--navy-900));
  color:#fff;
  padding:26px 18px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:6px 10px 26px;
}

.brand-mark{
  width:38px;
  height:38px;
  flex-shrink:0;
  object-fit:contain;
  background:rgba(255,255,255,.94);
  border-radius:9px;
  padding:5px;
}

.brand-name{ font-family:var(--font-display); font-weight:700; font-size:17px; }
.brand-sub{ font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:rgba(255,255,255,.55); margin-top:1px; }

.nav{ display:flex; flex-direction:column; gap:3px; }

.nav a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 14px;
  border-radius:var(--radius-sm);
  text-decoration:none;
  color:rgba(255,255,255,.82);
  font-size:14.5px;
  font-weight:500;
  transition:background .15s, color .15s;
}

.nav a .icon{ width:19px; text-align:center; flex-shrink:0; }

.nav a:hover{ background:rgba(255,255,255,.08); color:#fff; }

.nav a.active{
  background:linear-gradient(90deg,rgba(17,199,244,.22),rgba(17,199,244,.06));
  color:#fff;
  box-shadow:inset 3px 0 0 var(--cyan-500);
}

.nav a:focus-visible{ outline:2px solid var(--cyan-500); outline-offset:2px; }

.nav-group-label{
  font-size:11px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:rgba(255,255,255,.4);
  margin:20px 14px 8px;
}

.sidebar-footer{
  margin-top:auto;
  padding:14px;
  border-radius:var(--radius-sm);
  background:rgba(255,255,255,.06);
  font-size:12.5px;
  color:rgba(255,255,255,.7);
  line-height:1.5;
}

.sidebar-footer strong{ color:#fff; }

/* ---------- Main ---------- */

.main{
  flex:1;
  padding:28px 34px 40px;
  min-width:0;
}

.topbar{
  background:var(--surface);
  padding:10px 18px;
  border-radius:var(--radius-md);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  box-shadow:0 2px 12px rgba(10,40,80,.07);
}

.greeting h1{
  font-family:var(--font-display);
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:240px;
}

.greeting .date{
  font-size:11px;
  color:var(--text-600);
  margin-top:1px;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.search-wrap{ position:relative; }

.search-wrap svg{
  position:absolute;
  left:9px;
  top:50%;
  transform:translateY(-50%);
  opacity:.45;
}

.search-wrap input{
  padding:7px 10px 7px 28px;
  width:180px;
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--bg);
  font-size:12.5px;
  font-family:var(--font-body);
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}

.search-wrap input:focus{
  border-color:var(--cyan-600);
  box-shadow:0 0 0 3px rgba(0,191,206,.14);
  background:#fff;
}

.avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--navy-800),var(--cyan-600));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-display);
  font-weight:600;
  font-size:11px;
  flex-shrink:0;
}

/* ---------- Stat cards ---------- */

.cards{
  display:flex;
  gap:10px;
  margin:14px 0;
}

.card{
  background:var(--surface);
  padding:10px 14px;
  border-radius:var(--radius-sm);
  box-shadow:0 2px 10px rgba(10,40,80,.06);
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
}

.card .ring{ flex-shrink:0; }

.card-label{
  font-size:10px;
  color:var(--text-600);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.5px;
  white-space:nowrap;
}

.card-value{
  font-family:var(--font-mono);
  font-size:16px;
  font-weight:600;
  margin-top:2px;
  color:var(--text-900);
}

/* ---------- Section headers ---------- */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin:34px 0 16px;
}

.section-head h2{
  font-family:var(--font-display);
  font-size:19px;
  font-weight:600;
}

.section-head a{
  font-size:13.5px;
  font-weight:600;
  color:var(--cyan-700);
  text-decoration:none;
}

.section-head a:hover{ text-decoration:underline; }

/* ---------- Courses ---------- */

.courses{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.course{
  background:var(--surface);
  padding:20px;
  border-radius:var(--radius-md);
  box-shadow:0 4px 18px rgba(10,40,80,.06);
  display:flex;
  flex-direction:column;
}

.course-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.course-tag{
  font-size:11px;
  font-weight:600;
  letter-spacing:.4px;
  text-transform:uppercase;
  color:var(--cyan-700);
  background:rgba(17,199,244,.12);
  padding:4px 9px;
  border-radius:6px;
}

.course h3{
  font-family:var(--font-display);
  font-size:16.5px;
  font-weight:600;
  margin:12px 0 10px;
}

.progress-track{
  height:8px;
  background:var(--border);
  border-radius:5px;
  overflow:hidden;
  margin-bottom:8px;
}

.progress-fill{
  height:100%;
  border-radius:5px;
  background:linear-gradient(90deg,var(--navy-800),var(--cyan-500));
}

.progress-fill.complete{ background:var(--success); }

.course-meta{
  font-size:12.5px;
  color:var(--text-600);
  font-family:var(--font-mono);
  margin-bottom:16px;
}

.course button{
  margin-top:auto;
  padding:11px 16px;
  border:none;
  background:linear-gradient(90deg,var(--navy-800),var(--cyan-600));
  color:#fff;
  border-radius:var(--radius-sm);
  cursor:pointer;
  font-weight:600;
  font-size:13.5px;
  font-family:var(--font-body);
  transition:transform .15s, box-shadow .15s;
}

.course button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(17,199,244,.28);
}

.course button:focus-visible{ outline:2px solid var(--navy-800); outline-offset:3px; }

.course button.secondary{
  background:var(--surface);
  color:var(--cyan-700);
  border:1.5px solid var(--cyan-600);
}

.course button.secondary:hover{ background:rgba(17,199,244,.08); box-shadow:none; }

/* ---------- Mobile ---------- */

.menu-toggle{ display:none; }

@media (max-width:980px){

  .sidebar{
    position:fixed;
    left:0; top:0;
    z-index:20;
    transform:translateX(-100%);
    transition:transform .2s ease;
    width:250px;
  }

  .sidebar.open{ transform:translateX(0); }

  .main{ padding:20px; }

  .menu-toggle{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:40px; height:40px;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--border);
    background:var(--surface);
    cursor:pointer;
  }

  .cards{ grid-template-columns:repeat(2,1fr); }
  .courses{ grid-template-columns:1fr; }
  .search-wrap input{ width:180px; }

  .scrim{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(2,12,26,.4);
    z-index:15;
  }

  .scrim.show{ display:block; }
}

@media (max-width:560px){
  .topbar{ flex-wrap:wrap; }
  .search-wrap input{ width:140px; }
  .cards{ grid-template-columns:1fr 1fr; }
}

</style>
</head>

<body>

<div class="scrim" id="scrim"></div>

<main class="main">

  <div class="topbar">

    <div style="display:flex; align-items:center; gap:14px;">
      <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">☰</button>

        <h1 id="welcomeMsg">Welcome back 👋</h1>
        <div class="date" id="todayDate"></div>

    <div class="topbar-right">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#55677E" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#55677E" stroke-width="2" stroke-linecap="round"/></svg>

  </section>

<script>

// ---------- Auth guard ----------
const raw = localStorage.getItem('softmarc_user');
if (!raw) {
  // Not logged in — send back to login
  window.location.href = 'index.html';
}

const user = JSON.parse(raw);

// ---------- Personalise the page ----------
document.getElementById('todayDate').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

document.getElementById('welcomeMsg').textContent = `Welcome back, ${user.full_name} 👋`;

// Avatar: first letter of each word in name
const initials = user.full_name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
document.getElementById('avatarInitials').textContent = initials;

// ---------- Show Admin Panel link only for admin role ----------
if (user.role === 'admin') {
  const adminLink = document.getElementById('adminLink');
  adminLink.style.display = 'flex';
  adminLink.href = 'admin.html';
}

// ---------- Logout ----------
document.getElementById('logoutBtn').addEventListener('click', (e) => {
  e.preventDefault();
  localStorage.removeItem('softmarc_user');
  window.location.href = 'index.html';
});

// ---------- Sidebar toggle (mobile) ----------
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
const menuToggle = document.getElementById('menuToggle');

function toggleSidebar(open){
  sidebar.classList.toggle('open', open);
  scrim.classList.toggle('show', open);
  menuToggle.setAttribute('aria-expanded', String(open));
}

menuToggle.addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
scrim.addEventListener('click', () => toggleSidebar(false));

// ---------- Dynamic course and metrics engine ----------
const COURSE_DEFS = [
  {
    name: 'CATIA V5 Part Design',
    tag: 'Part Design',
    modules: 12,
    hours: 18,
    defaultDone: [0, 1, 2, 3, 4, 5, 6, 7] // ~67% complete
  },
  {
    name: 'CATIA Assembly Design',
    tag: 'Assembly',
    modules: 10,
    hours: 14,
    defaultDone: [0, 1, 2, 3] // ~40% complete
  },
  {
    name: 'CATIA Sheet Metal Design',
    tag: 'Sheet Metal',
    modules: 9,
    hours: 13,
    defaultDone: [0, 1, 2, 3, 4, 5, 6, 7, 8] // 100% complete
  },
  {
    name: 'CATIA Generative Shape Design',
    tag: 'Surfacing',
    modules: 8,
    hours: 12,
    defaultDone: [0, 1, 2, 3, 4, 5, 6, 7] // 100% complete
  },
  {
    name: 'CATIA DMU Kinematics',
    tag: 'Simulation',
    modules: 6,
    hours: 9,
    defaultDone: [0] // ~16% complete
  },
  {
    name: 'CATIA Drafting & Annotations',
    tag: 'Drafting',
    modules: 7,
    hours: 10,
    defaultDone: [] // 0% complete
  }
];

let totalCourses = COURSE_DEFS.length;
let completedCount = 0;
let progressSum = 0;
let totalHoursLogged = 0;

let continueHtml = '';

COURSE_DEFS.forEach(course => {
  const doneKey = 'done_' + course.name;
  // If no progress exists yet, seed with default progress
  if (localStorage.getItem(doneKey) === null) {
    localStorage.setItem(doneKey, JSON.stringify(course.defaultDone));
  }
  const doneList = JSON.parse(localStorage.getItem(doneKey) || '[]');
  const doneSet = new Set(doneList);
  const pct = Math.round((doneSet.size / course.modules) * 100);

  progressSum += pct;
  if (pct === 100) {
    completedCount++;
  }
  totalHoursLogged += (pct / 100) * course.hours;

  if (pct > 0 && pct < 100) {
    let nextIdx = 0;
    for (let i = 0; i < course.modules; i++) {
      if (!doneSet.has(i)) { nextIdx = i; break; }
    }
    continueHtml += `
      <div class="course">
        <div class="course-top">
          <div class="course-tag">${course.tag}</div>
        </div>
        <h3>${course.name}</h3>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="course-meta">${pct}% complete · Module ${nextIdx + 1} of ${course.modules}</div>
        <button onclick="openLesson('${course.name}', ${nextIdx})">Continue</button>
      </div>`;
  } else if (pct === 100) {
    continueHtml += `
      <div class="course">
        <div class="course-top">
          <div class="course-tag">${course.tag}</div>
        </div>
        <h3>${course.name}</h3>
        <div class="progress-track"><div class="progress-fill complete" style="width:100%"></div></div>
        <div class="course-meta">Completed · Certified</div>
        <button class="secondary" onclick="viewCert()">View certificate</button>
      </div>`;
  } else {
    continueHtml += `
      <div class="course">
        <div class="course-top">
          <div class="course-tag">${course.tag}</div>
        </div>
        <h3>${course.name}</h3>
        <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
        <div class="course-meta">Not started · 0% complete</div>
        <button onclick="openLesson('${course.name}', 0)">Start</button>
      </div>`;
  }
});

let avgProgress = Math.round(progressSum / totalCourses);
let finalHours = Math.round(totalHoursLogged);

// Render stats cards
const statsCards = document.getElementById('statsCards');
statsCards.innerHTML = `
  <div class="card">
    <svg class="ring" width="36" height="36" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#E1E9F1" stroke-width="6"/>
      <circle cx="28" cy="28" r="24" fill="none" stroke="#0A73B8" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="${150.8 * (1 - totalCourses/10)}" transform="rotate(-90 28 28)"/>
      <text x="28" y="33" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#0E2238">${totalCourses}</text>
    </svg>
    <div>
      <div class="card-label">Courses</div>
      <div class="card-value">${totalCourses}</div>
    </div>
  </div>

  <div class="card">
    <svg class="ring" width="36" height="36" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#E1E9F1" stroke-width="6"/>
      <circle cx="28" cy="28" r="24" fill="none" stroke="#11C7F4" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="${150.8 * (1 - avgProgress/100)}" transform="rotate(-90 28 28)"/>
      <text x="28" y="33" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" fill="#0E2238">${avgProgress}%</text>
    </svg>
    <div>
      <div class="card-label">Progress</div>
      <div class="card-value">${avgProgress}%</div>
    </div>
  </div>

  <div class="card">
    <svg class="ring" width="36" height="36" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#E1E9F1" stroke-width="6"/>
      <circle cx="28" cy="28" r="24" fill="none" stroke="#22B37A" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="${150.8 * (1 - completedCount/totalCourses)}" transform="rotate(-90 28 28)"/>
      <text x="28" y="33" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" fill="#0E2238">${completedCount}</text>
    </svg>
    <div>
      <div class="card-label">Certificates</div>
      <div class="card-value">${completedCount}</div>
    </div>
  </div>

  <div class="card">
    <svg class="ring" width="36" height="36" viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="24" fill="none" stroke="#E1E9F1" stroke-width="6"/>
      <circle cx="28" cy="28" r="24" fill="none" stroke="#0A3D66" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0" transform="rotate(-90 28 28)"/>
      <text x="28" y="33" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" fill="#0E2238">${finalHours}</text>
    </svg>
    <div>
      <div class="card-label">Hours logged</div>
      <div class="card-value">${finalHours}</div>
    </div>
  </div>`;

document.getElementById('continueCourses').innerHTML = continueHtml;

function openLesson(course, module){
  window.location.href = 'lesson.html?course='+encodeURIComponent(course)+'&module='+module;
}
function viewCert(){
  window.location.href = 'certificates.html';
}
</script>
