<style>

:root{
  --navy-950:#051B33;
  --navy-900:#06284A;
  --navy-800:#0A3D66;
  --cyan-500:#11C7F4;
  --cyan-600:#0A9FD1;
  --cyan-700:#0A73B8;
  --surface:#FFFFFF;
  --bg:#F1F6FB;
  --text-900:#0E2238;
  --text-600:#55677E;
  --text-400:#90A0B4;
  --border:#E1E9F1;
  --success:#22B37A;
  --danger:#D9463C;
  --warn:#F59E0B;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius-lg:18px;
  --radius-md:14px;
  --radius-sm:10px;
  --sidebar-w:252px;
}

*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:var(--font-body); background:var(--bg); color:var(--text-900); display:flex; min-height:100vh; }
a{ color:inherit; text-decoration:none; }

.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:linear-gradient(180deg,var(--navy-950),var(--navy-900));
  color:#fff; padding:26px 18px;
  position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column;
}
.brand{ display:flex; align-items:center; gap:12px; padding:6px 10px 26px; }
.brand-mark{ width:38px; height:38px; flex-shrink:0; object-fit:contain; background:rgba(255,255,255,.94); border-radius:9px; padding:5px; }
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:17px; }
.brand-sub{ font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:rgba(255,255,255,.55); margin-top:1px; }
.nav{ display:flex; flex-direction:column; gap:3px; }
.nav a{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--radius-sm); color:rgba(255,255,255,.82); font-size:14.5px; font-weight:500; transition:background .15s,color .15s; }
.nav a .icon{ width:19px; text-align:center; flex-shrink:0; }
.nav a:hover{ background:rgba(255,255,255,.08); color:#fff; }
.nav a.active{ background:linear-gradient(90deg,rgba(0,191,206,.22),rgba(0,191,206,.06)); color:#fff; box-shadow:inset 3px 0 0 var(--cyan-500); }
.nav-group-label{ font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:rgba(255,255,255,.4); margin:20px 14px 8px; }
.sidebar-footer{ margin-top:auto; padding:14px; border-radius:var(--radius-sm); background:rgba(255,255,255,.06); font-size:12.5px; color:rgba(255,255,255,.7); line-height:1.5; }

.main{ flex:1; padding:28px 34px 40px; min-width:0; }
.topbar{ background:var(--surface); padding:18px 24px; border-radius:var(--radius-md); display:flex; justify-content:space-between; align-items:center; gap:20px; box-shadow:0 4px 18px rgba(10,40,80,.06); margin-bottom:28px; }
.greeting h1{ font-family:var(--font-display); font-size:21px; font-weight:600; }
.greeting .sub{ font-size:13px; color:var(--text-600); margin-top:2px; }
.topbar-right{ display:flex; align-items:center; gap:16px; }
.search-wrap{ position:relative; }
.search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5; }
.search-wrap input{ padding:11px 14px 11px 38px; width:240px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--bg); font-size:14px; font-family:var(--font-body); outline:none; transition:border-color .15s,box-shadow .15s; }
.search-wrap input:focus{ border-color:var(--cyan-600); box-shadow:0 0 0 4px rgba(0,191,206,.14); background:#fff; }
.avatar{ width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--navy-800),var(--cyan-600)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:14px; flex-shrink:0; }

.panel{ background:var(--surface); border-radius:var(--radius-md); box-shadow:0 4px 18px rgba(10,40,80,.06); overflow:hidden; }
.panel-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--border); }
.panel-head h2{ font-family:var(--font-display); font-size:17px; font-weight:600; }
.section-title{ font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:18px; }

.badge{ font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; }
.badge-cyan{ background:rgba(0,191,206,.14); color:var(--cyan-700); }
.badge-navy{ background:rgba(0,90,130,.12); color:var(--navy-800); }
.badge-green{ background:rgba(34,179,122,.14); color:#1A9A68; }
.badge-warn{ background:rgba(245,158,11,.14); color:#B45309; }

.btn{ padding:11px 18px; border:none; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; font-family:var(--font-body); cursor:pointer; transition:transform .15s,box-shadow .15s; }
.btn-primary{ background:linear-gradient(90deg,var(--navy-800),var(--cyan-600)); color:#fff; }
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 10px 20px rgba(0,191,206,.28); }
.btn-outline{ background:var(--surface); color:var(--cyan-700); border:1.5px solid var(--cyan-600); }
.btn-outline:hover{ background:rgba(0,191,206,.08); }

.menu-toggle{ display:none; }
.scrim{ display:none; position:fixed; inset:0; background:rgba(2,12,26,.4); z-index:15; }
.scrim.show{ display:block; }

@media(max-width:980px){
  .sidebar{ position:fixed; left:0; top:0; z-index:20; transform:translateX(-100%); transition:transform .2s ease; }
  .sidebar.open{ transform:translateX(0); }
  .main{ padding:20px; }
  .menu-toggle{ display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface); cursor:pointer; }
  .search-wrap input{ width:160px; }
}

.cert-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.cert-card{ background:var(--surface); border-radius:var(--radius-md); box-shadow:0 4px 18px rgba(10,40,80,.06); overflow:hidden; }
.cert-banner{ height:90px; background:linear-gradient(135deg,var(--navy-950),var(--navy-800)); display:flex; align-items:center; justify-content:center; font-size:38px; }
.cert-body{ padding:18px; }
.cert-body h3{ font-family:var(--font-display); font-size:15.5px; font-weight:600; margin-bottom:6px; }
.cert-body .meta{ font-size:12.5px; color:var(--text-600); font-family:var(--font-mono); margin-bottom:14px; }
.cert-id{ font-size:11px; color:var(--text-400); font-family:var(--font-mono); margin-top:8px; }
@media(max-width:900px){ .cert-grid{ grid-template-columns:1fr 1fr; } }
@media(max-width:560px){ .cert-grid{ grid-template-columns:1fr; } }
</style>
</head>

<script>
const _raw = localStorage.getItem('softmarc_user');
if (!_raw) { window.location.href = 'index.html'; }
const _user = JSON.parse(_raw || '{}');
document.getElementById('topbarName').textContent = _user.full_name || '';
const _ini = (_user.full_name||'AB').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
document.getElementById('avatarInitials').textContent = _ini;
if (_user.role === 'admin') {
  const al = document.getElementById('adminLink');
  if(al){ al.style.display='flex'; al.href='admin.html'; }
}
document.getElementById('logoutBtn').addEventListener('click', e => {
  e.preventDefault();
  localStorage.removeItem('softmarc_user');
  window.location.href = 'index.html';
});
const _sb = document.getElementById('sidebar');
const _sc = document.getElementById('scrim');
const _mt = document.getElementById('menuToggle');
if(_mt){ _mt.addEventListener('click', ()=>{ _sb.classList.toggle('open'); _sc.classList.toggle('show'); }); }
if(_sc){ _sc.addEventListener('click', ()=>{ _sb.classList.remove('open'); _sc.classList.remove('show'); }); }

// Dynamic course list matching rest of application
const COURSE_DEFS = [
  {
    name: 'CATIA V5 Part Design',
    tag: 'Part Design',
    modules: 12,
    hours: 18,
    defaultDone: [0, 1, 2, 3, 4, 5, 6, 7], // ~67% complete
    banner: '🏆',
    code: 'CPD'
  },
  {
    name: 'CATIA Assembly Design',
    tag: 'Assembly',
    modules: 10,
    hours: 14,
    defaultDone: [0, 1, 2, 3], // ~40% complete
    banner: '🌟',
    code: 'CAD'
  },
  {
    name: 'CATIA Sheet Metal Design',
    tag: 'Sheet Metal',
    modules: 9,
    hours: 13,
    defaultDone: [0, 1, 2, 3, 4, 5, 6, 7, 8], // 100% complete
    banner: '🏅',
    code: 'CSM'
  },
  {
    name: 'CATIA Generative Shape Design',
    tag: 'Surfacing',
    modules: 8,
    hours: 12,
    defaultDone: [0, 1, 2, 3, 4, 5, 6, 7], // 100% complete
    banner: '🎖',
    code: 'GSD'
  },
  {
    name: 'CATIA DMU Kinematics',
    tag: 'Simulation',
    modules: 6,
    hours: 9,
    defaultDone: [0], // ~16% complete
    banner: '⭐',
    code: 'DMU'
  },
  {
    name: 'CATIA Drafting & Annotations',
    tag: 'Drafting',
    modules: 7,
    hours: 10,
    defaultDone: [], // 0% complete
    banner: '📏',
    code: 'CDA'
  }
];

function renderCertificates() {
  const container = document.getElementById('certContainer');
  let completedCourses = [];

  COURSE_DEFS.forEach(course => {
    const doneKey = 'done_' + course.name;
    // Fallback to defaultDone if not initialized
    if (localStorage.getItem(doneKey) === null) {
      localStorage.setItem(doneKey, JSON.stringify(course.defaultDone));
    }
    const doneList = JSON.parse(localStorage.getItem(doneKey) || '[]');
    const doneSet = new Set(doneList);
    const pct = Math.round((doneSet.size / course.modules) * 100);

    if (pct === 100) {
      completedCourses.push(course);
    }
  });

  if (completedCourses.length === 0) {
    container.innerHTML = `
      <p style="color:var(--text-600);margin-bottom:22px;font-size:14.5px;">You have not earned any certificates yet.</p>
      <div style="background:var(--surface);border-radius:var(--radius-md);box-shadow:0 4px 18px rgba(10,40,80,.06);padding:40px;text-align:center;">
        <h3 style="font-size:18px;margin-bottom:8px;">No Certifications Found</h3>
        <p style="color:var(--text-600);margin-bottom:20px;">Complete 100% of any course's modules to unlock your certificate here.</p>
        <button class="btn btn-primary" onclick="window.location.href='courses.html'">Go to My Courses</button>
      </div>`;
    return;
  }

  let html = `
    <p style="color:var(--text-600);margin-bottom:22px;font-size:14.5px;">You have earned <strong>${completedCourses.length} certificates</strong>. Download or share them below.</p>
    <div class="cert-grid">`;

  completedCourses.forEach(course => {
    html += `
      <div class="cert-card">
        <div class="cert-banner">${course.banner}</div>
        <div class="cert-body">
          <h3>${course.name}</h3>
          <div class="meta">Issued 10 Aug 2026</div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" style="flex:1" onclick="window.location.href='view_certificate.html?course=' + encodeURIComponent('${course.name}') + '&id=SM-2026-${course.code}-0041'">View / Print</button>
            <button class="btn btn-outline" style="flex:1" onclick="alert('Share link copied to clipboard!')">Share</button>
          </div>
          <div class="cert-id">ID: SM-2026-${course.code}-0041</div>
        </div>
      </div>`;
  });

  html += `</div>`;
  container.innerHTML = html;
}

renderCertificates();
</script>
